name: scoring-cron

# Runs less often than ingestion-cron.yml — scores don't need to be
# live-live (docs/ARCHITECTURE.md §2.4). Every 4 hours is a starting point,
# not a tuned value; adjust once there's enough real traffic to know
# whether that cadence over- or under-serves the badge/dashboard.
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}  # manual trigger for testing

jobs:
  compute-scores:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scoring
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python compute_scores.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Added 2026-09-27: tvl.py now queries live on-chain balances
          # (see scoring/tvl.py's module docstring for why) instead of
          # deriving TVL from stored token_flows history, so this job needs
          # RPC access for the first time. Reuses the same dedicated-endpoint
          # secrets ingestion-cron.yml already has — tvl.py's own small pool
          # (separate from ingestion/worker.py's, see its docstring) picks
          # up whichever of these are set and falls back to the free
          # mirrors otherwise. Call volume here is tiny compared to
          # ingestion (a handful of projects x contracts x 3 tokens, once
          # per run), so this is unlikely to meaningfully compete for quota.
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
          ALCHEMY_ARC_RPC_URL: ${{ secrets.ALCHEMY_ARC_RPC_URL }}
          DRPC_ARC_RPC_URL: ${{ secrets.DRPC_ARC_RPC_URL }}
          QUICKNODE_ARC_RPC_URL: ${{ secrets.QUICKNODE_ARC_RPC_URL }}
