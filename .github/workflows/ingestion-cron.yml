name: Ingestion cron

on:
  # RESUMED 2026-09-27 after jump_and_seed_backfill.py moved the live
  # checkpoint forward to near the chain tip and split the skipped range
  # into a separate, bounded historical_backfill_state job (see
  # backfill.yml + backfill_historical.py). Live ingestion and the
  # historical backfill now track completely separate checkpoint state, so
  # there's no more race to pause for — safe to run both at once.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # allow manual runs from the Actions tab

# Queue instead of overlapping: two simultaneous runs would race on the
# checkpoint. (apply_ingest_batch() rejects a stale batch rather than
# double-counting, but queueing avoids the wasted work and red runs.)
concurrency:
  group: ingestion-cron
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Needed only by the last step, which starts the next run (see "Chain the next run").
    permissions:
      contents: read
      actions: write
    # 2026-10-07: 45 -> 75. Runs now follow the chain tip for up to
    # RUN_TIME_BUDGET_SECONDS (55 min) after catching up, then discovery (~5 min) runs.
    # The repo is public, so Actions minutes are free; a private repo would burn its
    # monthly allowance in days with an always-on job like this.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ingestion
        run: pip install -r requirements.txt

      - name: Run ingestion worker
        working-directory: ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Added 2026-10-03: this secret existed but was never actually
          # wired into this workflow's env — discovery.py's
          # _gecko_token_info() and fetch_trending_pool_candidates() have
          # been silently running on CoinGecko's free/rate-limited tier in
          # CI this whole time, not the pro tier, with zero visibility into
          # that gap until trending-pool seeding stayed at 0 for two runs.
          COINGECKO_PRO_API_KEY: ${{ secrets.COINGECKO_PRO_API_KEY }}
          # Free/default endpoint — kept as the last-resort fallback in the
          # pool (see ingestion/worker.py). Confirmed to throttle GitHub
          # Actions' source IP specifically (docs/BUGS.md #4/#5).
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
          # Dedicated, authenticated endpoints — tried first, each with its
          # own individual quota. Any not set are simply skipped by
          # ingestion/worker.py's _dedicated_endpoint_specs(). Set these as
          # repo secrets (Settings -> Secrets and variables -> Actions),
          # never commit the actual key/URL values.
          ALCHEMY_ARC_RPC_URL: ${{ secrets.ALCHEMY_ARC_RPC_URL }}
          DRPC_ARC_RPC_URL: ${{ secrets.DRPC_ARC_RPC_URL }}
          BLOCKDAEMON_ARC_RPC_URL: ${{ secrets.BLOCKDAEMON_ARC_RPC_URL }}
          BLOCKDAEMON_API_KEY: ${{ secrets.BLOCKDAEMON_API_KEY }}
          QUICKNODE_ARC_RPC_URL: ${{ secrets.QUICKNODE_ARC_RPC_URL }}
          # Rollup path (2026-10-04, ingestion/rollup.py). 2 RPC calls per
          # block now (was ~13), so concurrency counts blocks in flight.
          # Raise RPC_CONCURRENCY only after watching logs for 429s.
          RPC_CONCURRENCY: "4"
          BATCH_BLOCKS: "500"
          # Per-run cap raised 20000 -> 400000: 20000 blocks is ~2.8h of chain time, so
          # runs that fire every ~4.5h could never catch up. The time budget below is the
          # real limit now (at ~45 blocks/s a 55-min run can cover ~150k blocks).
          MAX_BLOCKS_PER_RUN: "400000"
          # Stop starting new sub-batches after 55 min (job timeout is 75). The checkpoint
          # is saved per sub-batch, so nothing is lost.
          RUN_TIME_BUDGET_SECONDS: "3300"
          # After catching up, keep polling for new blocks until the budget ends, so the
          # data stays seconds-fresh instead of going stale until the next run starts.
          FOLLOW_TIP: "true"
          TIP_POLL_SECONDS: "10"
        run: python worker.py

      # Chain the next run. GitHub's `*/5` cron was observed firing only every 3-5 HOURS,
      # so each run starts the next itself instead of waiting for the schedule.
      # (A workflow cannot listen to its own completion via `workflow_run` - GitHub rejects
      # the file - but a workflow_dispatch created with GITHUB_TOKEN is explicitly allowed.)
      # Success-only: a failing run never retries in a tight loop; the schedule above is
      # the restart path after a failure. The new run waits in the concurrency group until
      # this job finishes, then starts immediately.
      - name: Chain the next run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ingestion-cron.yml --ref "${{ github.ref_name }}"