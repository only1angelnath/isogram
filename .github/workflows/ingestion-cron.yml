name: Ingestion cron

on:
  schedule:
    # Every 5 minutes. Arc's public RPC has no documented rate limit, but
    # this is a deliberately conservative starting cadence — see
    # docs/ARCHITECTURE.md §4. Tighten or loosen once real usage patterns
    # are known.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # allow manual runs from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 4  # a run should never approach the next cron tick
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ingestion
        run: pip install -r requirements.txt

      - name: Run ingestion worker
        working-directory: ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
        run: python worker.py