name: Ingestion cron

on:
  # PAUSED 2026-09-27 during backfill.yml's run — both workflows write the
  # same sync_state checkpoint row, and a scheduled run finishing after the
  # backfill has already pushed the checkpoint far ahead could overwrite it
  # backward, losing progress. Restore this once the backlog is closed:
  #
  #   schedule:
  #     - cron: "*/5 * * * *"
  #
  # workflow_dispatch below is left enabled so this can still be triggered
  # manually if needed while paused.
  workflow_dispatch: {}  # allow manual runs from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Bumped 10 -> 45: MAX_BLOCKS_PER_RUN raised 100 -> 3000 in worker.py to
    # cope with GitHub's scheduled trigger firing hours apart instead of
    # every 5 minutes (see worker.py's MAX_BLOCKS_PER_RUN comment). A run
    # doing 3000 blocks needs real headroom, especially before we know how
    # much the sticky-endpoint fix actually improves real throughput. If
    # runs are finishing well under this, it's fine to lower again.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ingestion
        run: pip install -r requirements.txt

      - name: Run ingestion worker
        working-directory: ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Free/default endpoint — kept as the last-resort fallback in the
          # pool (see ingestion/worker.py). Confirmed to throttle GitHub
          # Actions' source IP specifically (docs/BUGS.md #4/#5).
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
          # Dedicated, authenticated endpoints — tried first, each with its
          # own individual quota. Any not set are simply skipped by
          # ingestion/worker.py's _dedicated_endpoint_specs(). Set these as
          # repo secrets (Settings -> Secrets and variables -> Actions),
          # never commit the actual key/URL values.
          ALCHEMY_ARC_RPC_URL: ${{ secrets.ALCHEMY_ARC_RPC_URL }}
          DRPC_ARC_RPC_URL: ${{ secrets.DRPC_ARC_RPC_URL }}
          BLOCKDAEMON_ARC_RPC_URL: ${{ secrets.BLOCKDAEMON_ARC_RPC_URL }}
          BLOCKDAEMON_API_KEY: ${{ secrets.BLOCKDAEMON_API_KEY }}
          QUICKNODE_ARC_RPC_URL: ${{ secrets.QUICKNODE_ARC_RPC_URL }}
        run: python worker.py
