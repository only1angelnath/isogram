name: Ingestion cron

on:
  schedule:
    # Every 5 minutes. See docs/BUGS.md #4/#5 — rpc.mainnet.arc.io's rate
    # limit is confirmed (not just "no documented limit"), which is why the
    # worker now rotates across dedicated + free-mirror endpoints. Tighten
    # or loosen once real usage patterns are known against the new pool.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # allow manual runs from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Bumped 10 -> 15: retry/backoff + multi-endpoint rotation can add real
    # wall-clock time per run now (docs/BUGS.md #4/#5) — don't let the
    # timeout kill a run that would otherwise succeed on its 2nd or 3rd
    # endpoint.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ingestion
        run: pip install -r requirements.txt

      - name: Run ingestion worker
        working-directory: ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Free/default endpoint — kept as the last-resort fallback in the
          # pool (see ingestion/worker.py). Confirmed to throttle GitHub
          # Actions' source IP specifically (docs/BUGS.md #4/#5).
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL }}
          # Dedicated, authenticated endpoints — tried first, each with its
          # own individual quota. Any not set are simply skipped by
          # ingestion/worker.py's _dedicated_endpoint_specs(). Set these as
          # repo secrets (Settings -> Secrets and variables -> Actions),
          # never commit the actual key/URL values.
          ALCHEMY_ARC_RPC_URL: ${{ secrets.ALCHEMY_ARC_RPC_URL }}
          DRPC_ARC_RPC_URL: ${{ secrets.DRPC_ARC_RPC_URL }}
          BLOCKDAEMON_ARC_RPC_URL: ${{ secrets.BLOCKDAEMON_ARC_RPC_URL }}
          BLOCKDAEMON_API_KEY: ${{ secrets.BLOCKDAEMON_API_KEY }}
          QUICKNODE_ARC_RPC_URL: ${{ secrets.QUICKNODE_ARC_RPC_URL }}
        run: python worker.py
